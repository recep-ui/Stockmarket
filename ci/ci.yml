name: CI & Security Hardening Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: .NET 10 Backend Build & Parity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore BistQuant.slnx

      - name: Build Solution (Release)
        run: dotnet build BistQuant.slnx -c Release --no-restore

      - name: Run Test Suite (Unit & Integration Tests)
        run: dotnet test BistQuant.slnx -c Release --no-build --verbosity normal

      - name: Package Vulnerability Audit
        run: dotnet list package --vulnerable --include-transitive

  frontend-ci:
    name: Next.js 16 & TypeScript Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Next.js Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"

  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
