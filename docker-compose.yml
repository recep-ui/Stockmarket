services:
  # 1. Microsoft SQL Server 2022
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bistquant-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bistquant-net

  # 2. Redis In-Memory Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: bistquant-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bistquant-net

  # 3. ASP.NET Core REST API
  bistquant-api:
    build:
      context: .
      dockerfile: src/BistQuant.API/Dockerfile
    container_name: bistquant-api
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=BistQuantDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be set in .env (min 32 characters)}"
      Jwt__Issuer: "${JWT_ISSUER:-BistQuantApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-BistQuantClient}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__DefaultChatId: "${TELEGRAM_DEFAULT_CHAT_ID:-}"
    networks:
      - bistquant-net

  # 4. Background Quantitative Scanner Worker
  bistquant-worker:
    build:
      context: .
      dockerfile: src/BistQuant.Worker/Dockerfile
    container_name: bistquant-worker
    restart: unless-stopped
    depends_on:
      - bistquant-api
    environment:
      DOTNET_ENVIRONMENT: Production
      DatabaseProvider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=BistQuantDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
    networks:
      - bistquant-net

  # 5. Next.js 16 Web Application
  bistquant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bistquant-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "/api"
    networks:
      - bistquant-net

  # 6. Nginx Reverse Proxy (Only public gateway)
  nginx:
    image: nginx:alpine
    container_name: bistquant-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bistquant-api
      - bistquant-frontend
    networks:
      - bistquant-net

volumes:
  mssql_data:
  redis_data:

networks:
  bistquant-net:
    driver: bridge
